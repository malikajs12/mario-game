
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mario-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mario

  template:
    metadata:
      labels:
        app: mario

    spec:
      containers:
        - name: mario-container
          image: YOUR_DOCKERHUB_USERNAME/mario-game:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service

metadata:
  name: mario-service

spec:
  type: NodePort

  selector:
    app: mario

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP

